<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - Sistema de Gimnasios</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<div class="form-card">
  <h2>Iniciar sesión</h2>
  
  <div id="error-message" class="alert-error"></div>
  
  <form id="login-form">
    <div class="form-group">
      <label for="email">Correo</label>
      <input type="email" id="email" required placeholder="tu@correo.com">
    </div>
    
    <div class="form-group">
      <label for="password">Contraseña</label>
      <input type="password" id="password" required placeholder="••••••••">
    </div>
    
    <button type="submit" class="btn-primary" id="submit-btn">Ingresar</button>
  </form>
</div>

<script src="/js/auth.js"></script>
<script>
  // Si ya existe una sesión activa válida, redirige al dashboard automáticamente
  if (getValidToken()) {
    window.location.href = '/dashboard.html';
  }

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();
    const errorDiv = document.getElementById('error-message');
    
    errorDiv.style.display = 'none';

    const result = await loginUser(email, password);

    if (result.success) {
      window.location.href = '/dashboard.html';
    } else {
      errorDiv.textContent = result.message;
      errorDiv.style.display = 'block';
    }
  });
</script>
</body>
</html>
