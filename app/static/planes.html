<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planes de Membresia - Sistema de Gimnasios</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>

<div class="form-card" style="max-width: 860px;">
  <div class="page-header">
    <h2>Planes de Membresia</h2>
    <div class="header-actions">
        <a href="/dashboard.html" class="btn-secondary">Panel principal</a>
        <button onclick="logoutUser()" class="btn-small">cerrar sesión</button>
    </div>
</div>


<div class="form-group">
    <label for="gym-select">Gimnasio activo </label>
    <select id="gym-select"></select>    
</div>

<div id="list-error" class="alert-error"></div>
<div id="list-success" class="alert-success"></div>




<div class="section-title">Planes del gimnasio</div>
<div class="table-wrapper">
    <table class="data-table">
    <thead>
        <tr>
            <th>Titulo</th>
            <th>Duracion</th>
            <th>Costo</th>
            <th>Descuento</th>
            <th>Precio final</th>
            <th class="admin-only"></th>
        </tr>
    </thead>
    <tbody id="plans-body"> </tbody>
</table>
<p id="plans-empty" class="empty-state">Este gimnasio todavia no tiene planes.</p>
</div>


  <!-- CA3: el formulario solo se muestra al Administrador -->
  <div id="plan-form-section" class="admin-only">
    <div class="section-title" id="form-title">Nuevo plan</div>
    <div id="form-error" class="alert-error"></div>

    <form id="plan-form" novalidate>
      <div class="form-group">
        <label for="title">Título *</label>
        <input type="text" id="title" maxlength="100" placeholder="Plan Trimestral">
      </div>

      <div class="form-group">
        <label for="description">Descripción</label>
        <textarea id="description" rows="2" placeholder="Acceso a todas las áreas"></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="cost">Costo ($) *</label>
          <input type="number" id="cost" min="0.01" step="0.01" placeholder="1500.00">
        </div>
        <div class="form-group">
          <label for="duration">Duración (meses) *</label>
          <input type="number" id="duration" min="1" max="12" step="1" placeholder="3">
        </div>
        <div class="form-group">
          <label for="discount">Descuento (%)</label>
          <input type="number" id="discount" min="0" max="100" step="0.01" value="0">
        </div>
      </div>

      <div class="price-preview">
        <span>Precio final</span>
        <strong id="final-price-preview">$0.00</strong>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-primary" id="submit-btn">Crear plan</button>
        <button type="button" class="btn-secondary" id="cancel-edit-btn"  style="display: none;">Cancelar edicion</button>
      </div>
    </form>
  </div>

  <p id="manager-note" class="info-note" style="display: none;">
    Como Encargado puedes consultar los planes, pero solo un Administrador puede crearlos o modificarlos.
  </p>
</div>

<script src="/js/auth.js"></script>
<script src="/js/plans.js"></script>
</body>
</html>
